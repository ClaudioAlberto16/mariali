<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<meta name="description" content="Tarjetas de lectura de Mariali, Método Filadelfia">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<title>Mariali</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#050505}body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:14px}.app{width:min(100%,1050px)}.card{width:100%;min-height:min(78vh,710px);min-height:min(78dvh,710px);border:2px solid #171717;background:#fff;display:flex;flex-direction:column;padding:clamp(18px,3.2vw,34px)}.meta{display:flex;justify-content:space-between;align-items:center;color:#777}.code{font-size:clamp(13px,1.5vw,17px);font-weight:700}.count{font-size:clamp(11px,1.25vw,14px)}.word-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:290px;padding:20px 58px}.word{margin:0;text-align:center;font-size:clamp(64px,11.5vw,132px);line-height:1.08;letter-spacing:-.045em;font-family:"Poppins","Century Gothic",Futura,sans-serif;font-weight:800;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:12px}.arrow{border:0;background:transparent;color:#050505;padding:8px 0;display:grid;place-items:center;cursor:pointer;border-radius:8px}.arrow:hover{background:#f4f4f4}.arrow:disabled{opacity:.22;cursor:default;background:transparent}.arrow svg{width:34px;height:34px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.next-label{text-align:center;color:#777;font-size:12px}.bottom{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:24px;flex-wrap:wrap}.bottom label{color:#555;font-size:12px}select{appearance:none;border:1px solid #999;border-radius:3px;background:#fff;color:#111;padding:8px 34px 8px 11px;font:inherit;font-size:13px}.status{text-align:center;margin-top:12px;color:#888;font-size:11px}@media(max-width:600px){body{padding:8px}.card{min-height:calc(100vh - 16px);min-height:calc(100dvh - 16px);padding:18px 14px}.word-area{min-height:0;padding:15px 4px}.word{font-size:clamp(52px,13vw,90px)}.controls{grid-template-columns:42px 1fr 42px;gap:5px}.arrow svg{width:30px;height:30px}.bottom{padding-top:18px}}@media(max-height:560px){.card{min-height:94vh;min-height:94dvh}.word-area{min-height:150px}.word{font-size:clamp(48px,9vw,92px)}}
</style>
</head>
<body><main class="app" aria-label="Tarjetas de lectura de Mariali"><section class="card"><div class="meta"><span class="code" id="wordCode">S1.1</span><span class="count" id="wordCount">1 de 5</span></div><div class="word-area"><h1 class="word" id="word">lagartija</h1></div><div class="controls"><button class="arrow" id="previous" aria-label="Palabra anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="next-label">siguiente palabra</div><button class="arrow" id="next" aria-label="Siguiente palabra"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></section><div class="bottom"><label for="weekSelect">ir a semana:</label><select id="weekSelect" aria-label="Seleccionar semana"></select></div><div class="status" id="status" aria-live="polite">semana 1 · 5 palabras</div></main>
<script>
const weeks=[
["lagartija","camaleón","sapo","serpiente","rana"],
["maceta","balcón","escalera","pecera","repisa"],
["kínder","escuela","amigo","maestra","compañero"],
["comedor","recreo","patio","jardín","juegos"],
["fiesta","cumpleaños","pastel","invitados","regalos"],
["trabajar","leer","escribir","recortar","dibujar"],
["verde","azul","rojo","amarillo","blanco"],
["café","negro","rosa","naranja","morado"],
["rápido","veloz","lento","pesado","despacio"],
["mandarina","mamey","coco","kiwi","higo"],
["buscar","encontrar","asustar","enojar","platicar"],
["desayuno","salchichas","huevo","jugo","hot cakes"],
["mariposas","hormigas","abejas","escarabajo","cucaracha"],
["uniforme","playera","chamarra","tenis","zapatos"],
["mojado","pronto","siempre","seco","nunca"],
["simpático","gordo","flaca","iguales","diferentes"],
["abrir","cerrar","subir","bajar","bailar"],
["reptiles","mamíferos","peces","aves","dinosaurios"],
["pensar","apachurrar","despedazar","venir","ir"],
["grande","inmenso","enorme","descomunal","gigantesco"]];
const $=id=>document.getElementById(id),word=$("word"),code=$("wordCode"),count=$("wordCount"),status=$("status"),select=$("weekSelect"),prev=$("previous"),next=$("next");let week=1,pos=0;
weeks.forEach((_,i)=>{const o=document.createElement("option");o.value=i+1;o.textContent="semana "+(i+1);select.append(o)});
function seq(){return weeks.slice(0,week).flatMap((list,w)=>list.map((word,n)=>({word,w:w+1,n:n+1})))}
function render(){const all=seq(),x=all[pos];word.textContent=x.word;code.textContent="S"+x.w+"."+x.n;count.textContent=x.n+" de 5";status.textContent="semana "+week+" · "+all.length+" palabras en total";prev.disabled=pos===0;next.disabled=pos===all.length-1&&week===20;select.value=week}
function advance(){const all=seq();if(pos<all.length-1)pos++;else if(week<20){week++;pos=all.length}render()}
prev.onclick=()=>{if(pos>0){pos--;render()}};next.onclick=advance;select.onchange=e=>{week=+e.target.value;pos=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"&&pos>0){pos--;render()}if(e.key==="ArrowRight")advance()});render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
